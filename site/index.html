<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Usage | Zedong Peng</title>
<meta name="description" content="Daily coding-agent token usage and API-equivalent cost, scanned by T3 Code.">
<link rel="canonical" href="https://zedongpeng.com/ai-usage/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://zedongpeng.com/assets/css/site.css">
<!-- The look comes from zedongpeng.com's site.css; this block only lays the dashboard out, with its variables. -->
<style>
  .num { font-variant-numeric: tabular-nums; }
  .usage h2 { font-size: 17px; line-height: 1.4; margin: 0 0 16px; }
  .usage > section { margin-top: 56px; }
  .u-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 20px 24px; }
  .u-head h1 { margin: 0; }
  .usage > .lead { margin: 12px 0 0; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; }
  .seg { display: inline-flex; padding: 3px; border-radius: 999px; background: var(--wash); }
  .seg button { border: 0; background: transparent; color: var(--muted); font: 13px/20px var(--sans); padding: 4px 14px; border-radius: 999px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--bg); color: var(--fg); box-shadow: 0 0 0 1px var(--line); }
  .big { font-size: 32px; font-weight: 600; line-height: 1.15; letter-spacing: -0.01em; }
  .prov + .prov { margin-top: 20px; }
  .prov-row { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; }
  .prov-name { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
  .prov .prov-name { white-space: nowrap; }
  .val { font-weight: 500; }
  .dot { width: 8px; height: 8px; border-radius: 999px; flex: none; align-self: center; }
  .bar { height: 4px; border-radius: 999px; background: var(--wash); margin: 6px 0; overflow: hidden; }
  .bar > span { display: block; height: 100%; border-radius: 999px; }
  .legend { list-style: none; margin: 12px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 4px 20px; }
  .legend li { display: flex; align-items: center; gap: 8px; }
  .totals { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px 24px; }
  .stat .v { font-weight: 600; }
  .chart { position: relative; }
  .chart svg { display: block; width: 100%; height: 260px; overflow: visible; }
  .chart .gridline { stroke: var(--line); }
  .chart text { fill: var(--muted); font-size: 14px; }
  .tip { position: absolute; pointer-events: none; z-index: 2; min-width: 200px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font-size: 14px; line-height: 1.55; display: none; }
  .tip .r { display: flex; justify-content: space-between; gap: 12px; }
  .tip .muted { color: var(--muted); }
  .usage td { vertical-align: middle; }
  .usage td.r { text-align: right; white-space: nowrap; }
  .usage td:last-child { padding-right: 0; }
  .model { overflow-wrap: anywhere; }
  .usage .note { margin: 56px 0 0; max-width: 680px; }

  /* Wide: the number and the agents on the left, the chart on the right. */
  @media (min-width: 900px) {
    .top { display: grid; grid-template-columns: minmax(0, 19rem) minmax(0, 1fr); gap: 28px 56px; align-items: start; }
    .card { display: contents; }
    .headline { grid-column: 1; grid-row: 1; }
    .provs { grid-column: 1; grid-row: 2; }
    .chartbox { grid-column: 2; grid-row: 1 / span 2; min-width: 0; }
    .legend, .narrow, .prov .bar { display: none; }
    .totals { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  }
  /* Narrow: full-width controls, the number and chart in one card, then the agents with their share as a bar. */
  @media (max-width: 899px) {
    .controls { width: 100%; flex-direction: column-reverse; gap: 10px; }
    .seg { display: flex; }
    .seg button { flex: 1; font-size: 14px; padding: 7px 0; }
    .usage > section.top { margin-top: 32px; }
    .card { background: var(--wash); border-radius: 16px; padding: 20px; }
    .card .bar { background: var(--line); }
    .chartbox { margin-top: 20px; }
    .chartbox h2, .sess { display: none; }
    .chart svg { height: 220px; }
    .provs { margin-top: 40px; }
    .prov + .prov { margin-top: 0; }
    .prov { padding: 14px 0; border-bottom: 1px solid var(--line); }
  }
</style>
</head>
<body>
<script src="https://zedongpeng.com/assets/js/site-header.js"></script>
<main>
  <div class="wide usage">
    <header class="u-head page-head">
      <h1>Agent usage</h1>
      <div class="controls">
        <div class="seg" id="period" role="group" aria-label="Period"></div>
        <div class="seg" id="metric" role="group" aria-label="Metric"></div>
      </div>
    </header>
    <p class="lead">Daily coding-agent token usage and API-equivalent cost, scanned by T3 Code.</p>

    <section class="top">
      <div class="card">
        <div class="headline">
          <div class="big num" id="headline">–</div>
          <div class="small num" id="subline"></div>
        </div>
        <div class="chartbox">
          <h2 id="chart-title">Daily cost</h2>
          <div class="chart" id="chart"><svg id="svg" role="img" aria-label="Daily usage by agent"></svg><div class="tip" id="tip"></div></div>
          <ul class="legend small" id="legend"></ul>
        </div>
      </div>
      <div class="provs">
        <h2 class="narrow">Agents</h2>
        <div id="providers"></div>
      </div>
    </section>

    <section>
      <h2>Totals</h2>
      <div class="totals" id="totals"></div>
    </section>

    <section>
      <h2>By model</h2>
      <table><tbody id="models"></tbody></table>
    </section>

    <p class="small note" id="footer"></p>
  </div>
</main>
<footer class="zp-foot small">&copy; 2026 Zedong Peng</footer>

<script>
// One hue per agent, in a fixed order. Claude Code takes the site's accent; the rest are checked against it and the page background.
const PROVIDERS = {
  claude: { label: "Claude Code", color: "#d97757" },
  codex: { label: "Codex", color: "#2a78d6" },
  grok: { label: "Grok Build", color: "#1baf7a" },
  opencode: { label: "OpenCode", color: "#eda100" },
  pi: { label: "Pi", color: "#e87ba4" },
  cursor: { label: "Cursor", color: "#008300" },
  antigravity: { label: "Antigravity", color: "#6250d6" },
  muse: { label: "Muse Code", color: "#e34948" },
};
const prov = (p) => PROVIDERS[p] ?? { label: p, color: "#b0aea5" };
const PERIODS = [["7d", 7], ["30d", 30], ["90d", 90], ["All", 0]];
const METRICS = [["Cost", "cost"], ["Tokens", "tokens"]];

const store = {
  get(k, d) { try { return localStorage.getItem(k) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
const state = { days: Number(store.get("usage.days", 30)), metric: store.get("usage.metric", "cost") };

const usd = (n) => n >= 1000 ? "$" + n.toLocaleString("en-US", { maximumFractionDigits: 0 })
  : "$" + n.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const tok = (n) => {
  for (const [d, s] of [[1e12, "T"], [1e9, "B"], [1e6, "M"], [1e3, "K"]])
    if (n >= d) return (n / d).toLocaleString("en-US", { maximumFractionDigits: n / d >= 100 ? 0 : 1 }) + s;
  return String(n);
};
const pct = (x) => (x * 100).toLocaleString("en-US", { maximumFractionDigits: x < 0.01 ? 1 : 0 }) + "%";
const total = (t) => t.uncachedInputTokens + t.cachedInputTokens + t.cacheCreationTokens + t.outputTokens;
const value = (b) => state.metric === "cost" ? b.costUsd : b.tokens;
const fmt = (n) => state.metric === "cost" ? usd(n) : tok(n);
const el = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) k === "style" ? e.style.cssText = v : e.setAttribute(k, v);
  e.append(...kids);
  return e;
};

let DATA;

function addDays(day, n) {
  const d = new Date(day + "T00:00:00Z"); d.setUTCDate(d.getUTCDate() + n);
  return d.toISOString().slice(0, 10);
}

function render() {
  const all = DATA.buckets;
  const lastDay = DATA.today;
  // A period longer than the history starts at the first recorded day, so the chart has no empty stretch.
  const since = all[0]?.day ?? lastDay, wanted = state.days ? addDays(lastDay, -(state.days - 1)) : since;
  const firstDay = wanted > since ? wanted : since;
  const rows = all.filter((b) => b.day >= firstDay && b.day <= lastDay).map((b) => ({ ...b, tokens: total(b.totals) }));

  const sum = { cost: 0, tokens: 0, sessions: 0, cached: 0, uncached: 0, write: 0, output: 0, savings: 0 };
  const byProv = new Map(), byModel = new Map(), byDay = new Map();
  for (const b of rows) {
    sum.cost += b.costUsd; sum.tokens += b.tokens; sum.sessions += b.sessions;
    sum.cached += b.totals.cachedInputTokens; sum.uncached += b.totals.uncachedInputTokens;
    sum.write += b.totals.cacheCreationTokens; sum.output += b.totals.outputTokens; sum.savings += b.cacheSavingsUsd;
    const p = byProv.get(b.provider) ?? { cost: 0, tokens: 0, sessions: 0 };
    p.cost += b.costUsd; p.tokens += b.tokens; p.sessions += b.sessions; byProv.set(b.provider, p);
    const mk = b.provider + "\0" + b.model;
    const m = byModel.get(mk) ?? { provider: b.provider, model: b.model, cost: 0, tokens: 0 };
    m.cost += b.costUsd; m.tokens += b.tokens; byModel.set(mk, m);
    const d = byDay.get(b.day) ?? new Map();
    d.set(b.provider, (d.get(b.provider) ?? 0) + value(b)); byDay.set(b.day, d);
  }
  const key = state.metric === "cost" ? "cost" : "tokens";

  document.getElementById("headline").textContent = fmt(sum[key]);
  document.getElementById("subline").textContent =
    `${sum.sessions.toLocaleString("en-US")} sessions` + (state.metric === "cost" ? " · API-equivalent estimate" : "");

  const provs = [...byProv.entries()].sort((a, b) => b[1][key] - a[1][key]);
  const pBox = document.getElementById("providers"); pBox.replaceChildren();
  for (const [p, t] of provs) {
    const share = sum[key] ? t[key] / sum[key] : 0;
    pBox.append(el("div", { class: "prov" },
      el("div", { class: "prov-row" },
        el("span", { class: "prov-name" }, el("span", { class: "dot", style: `background:${prov(p).color}` }),
          el("span", {}, prov(p).label), el("span", { class: "small num sess" }, `${t.sessions.toLocaleString("en-US")} sessions`)),
        el("span", { class: "num val" }, fmt(t[key]))),
      el("div", { class: "bar" }, el("span", { style: `width:${share * 100}%;background:${prov(p).color}` })),
      el("div", { class: "small num" }, state.metric === "cost"
        ? `${pct(share)} of cost · ${tok(t.tokens)} tokens` : `${pct(share)} of tokens · ${usd(t.cost)}`)));
  }
  document.getElementById("legend").replaceChildren(...provs.map(([p]) =>
    el("li", {}, el("span", { class: "dot", style: `background:${prov(p).color}` }), prov(p).label)));

  document.getElementById("chart-title").textContent = state.metric === "cost" ? "Daily cost" : "Daily processed tokens";
  const days = []; for (let d = firstDay; d <= lastDay; d = addDays(d, 1)) days.push(d);
  drawChart(days, byDay, provs.map(([p]) => p));

  const totals = [["Processed tokens", tok(sum.tokens)], ["Cached input", tok(sum.cached)],
    ["Uncached input", tok(sum.uncached + sum.write)], ["Output", tok(sum.output)], ["Cache savings", usd(sum.savings)]];
  document.getElementById("totals").replaceChildren(...totals.map(([l, v]) =>
    el("div", { class: "stat" }, el("div", { class: "small" }, l), el("div", { class: "v num" }, v))));

  const models = [...byModel.values()].sort((a, b) => b[key] - a[key]);
  const peak = models[0]?.[key] || 1;
  document.getElementById("models").replaceChildren(...models.map((m) => el("tr", {},
    el("td", {}, el("div", { class: "prov-name" }, el("span", { class: "dot", style: `background:${prov(m.provider).color}` }),
        el("span", { class: "model" }, m.model)),
      el("div", { class: "bar" }, el("span", { style: `width:${(m[key] / peak) * 100}%;background:${prov(m.provider).color}` }))),
    el("td", { class: "r small num" }, state.metric === "cost" ? tok(m.tokens) : usd(m.cost)),
    el("td", { class: "r num", style: "font-weight:500" }, fmt(m[key])))));

  for (const [id, opts, cur] of [["period", PERIODS, state.days], ["metric", METRICS, state.metric]])
    for (const b of document.getElementById(id).children) b.setAttribute("aria-pressed", String(b.dataset.v === String(cur)));
}

function drawChart(days, byDay, order) {
  const svg = document.getElementById("svg"), tip = document.getElementById("tip");
  const W = svg.clientWidth || 600, H = svg.clientHeight || 260, wide = W >= 520, padL = wide ? 60 : 0, padB = 28, padT = 8;
  const totals = days.map((d) => [...(byDay.get(d)?.values() ?? [])].reduce((a, b) => a + b, 0));
  const max = Math.max(...totals, 0) || 1;
  const step = niceStep(max / 4), top = Math.ceil(max / step) * step;
  const y = (v) => H - padB - (v / top) * (H - padB - padT);
  const bw = (W - padL) / days.length, gap = Math.max(1, bw * 0.35);
  const ns = "http://www.w3.org/2000/svg";
  const make = (tag, attrs) => { const e = document.createElementNS(ns, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.replaceChildren();
  for (let v = 0; wide && v <= top + 1e-9; v += step) {
    svg.append(make("line", { x1: padL, x2: W, y1: y(v), y2: y(v), class: "gridline" }));
    const t = make("text", { x: padL - 8, y: y(v) + 5, "text-anchor": "end" }); t.textContent = state.metric === "cost" ? "$" + v.toLocaleString("en-US") : tok(v); svg.append(t);
  }
  const last = days.length - 1, marks = new Map([[0, "start"], [last, "end"]]);
  if (wide && last >= 8) marks.set(Math.round(last / 2), "middle");
  for (const [i, anchor] of marks) {
    const x = anchor === "start" ? padL : anchor === "end" ? W : padL + (i + 0.5) * bw;
    const t = make("text", { x, y: H - 6, "text-anchor": anchor });
    t.textContent = new Date(days[i] + "T00:00:00Z").toLocaleDateString("en-US", { month: "short", day: "numeric", timeZone: "UTC" });
    svg.append(t);
  }
  days.forEach((d, i) => {
    const x = padL + i * bw + gap / 2, w = Math.max(1, bw - gap);
    let acc = 0;
    for (const p of [...order].reverse()) {
      const v = byDay.get(d)?.get(p) ?? 0; if (!v) continue;
      svg.append(make("rect", { x, y: y(acc + v), width: w, height: Math.max(0.5, y(acc) - y(acc + v)), rx: Math.min(2, w / 3), style: `fill:${prov(p).color}` }));
      acc += v;
    }
    const hit = make("rect", { x: padL + i * bw, y: padT, width: bw, height: H - padB - padT, fill: "transparent" });
    hit.addEventListener("pointerenter", () => {
      const dayMap = byDay.get(d) ?? new Map();
      tip.replaceChildren(el("div", { class: "r", style: "margin-bottom:4px;font-weight:600" },
        el("span", {}, new Date(d + "T00:00:00Z").toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric", timeZone: "UTC" })),
        el("span", { class: "num" }, fmt(totals[i]))),
        ...order.filter((p) => dayMap.get(p)).map((p) => el("div", { class: "r" },
          el("span", { class: "prov-name" }, el("span", { class: "dot", style: `background:${prov(p).color}` }), prov(p).label),
          el("span", { class: "num muted" }, fmt(dayMap.get(p))))));
      tip.style.display = "block";
      const box = svg.getBoundingClientRect(), cx = ((padL + (i + 0.5) * bw) / W) * box.width;
      tip.style.left = Math.min(Math.max(0, cx - tip.offsetWidth / 2), box.width - tip.offsetWidth) + "px";
      tip.style.top = "-8px";
    });
    hit.addEventListener("pointerleave", () => { tip.style.display = "none"; });
    svg.append(hit);
  });
}

function niceStep(raw) {
  const mag = 10 ** Math.floor(Math.log10(raw || 1));
  for (const m of [1, 2, 2.5, 5, 10]) if (raw <= m * mag) return m * mag;
  return 10 * mag;
}

for (const [id, opts, k] of [["period", PERIODS, "days"], ["metric", METRICS, "metric"]]) {
  const box = document.getElementById(id);
  for (const [label, v] of opts) {
    const b = el("button", { type: "button", "data-v": String(v) }, label);
    b.addEventListener("click", () => { state[k] = k === "days" ? Number(v) : v; store.set("usage." + k, String(v)); render(); });
    box.append(b);
  }
}

fetch("data/usage.json", { cache: "no-cache" }).then((r) => r.json()).then((data) => {
  data.today = new Date(data.updatedAt).toLocaleDateString("en-CA", { timeZone: data.timeZone });
  DATA = data;
  const first = data.buckets[0]?.day;
  document.getElementById("footer").innerHTML =
    `Updated ${new Date(data.updatedAt).toLocaleString("en-US", { dateStyle: "medium", timeStyle: "short" })} · ` +
    `history since ${first ?? "—"} · days in ${data.timeZone} · ${data.machines ?? 1} machine${(data.machines ?? 1) === 1 ? "" : "s"}. Costs are API list-price equivalents from ` +
    `<a href="https://github.com/BerriAI/litellm">LiteLLM</a> rates, not what a subscription actually bills. ` +
    `Scanned with <a href="https://github.com/pingdotgg/t3code">T3 Code</a>'s usage reader. ` +
    `<a href="https://github.com/zedong-peng/ai-usage">Source</a>.`;
  render();
  addEventListener("resize", () => render());
});
</script>
</body>
</html>
